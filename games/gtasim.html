    <script>
    window.mergeChunks = async function (name, parts, baseDir) {
      baseDir = baseDir || "";
      var bufs = [];
      for (var i = 0; i < parts; i++) {
        var r = await fetch(baseDir + name + String(i).padStart(2, "0"));
        bufs.push(new Uint8Array(await r.arrayBuffer()));
      }
      var total = bufs.reduce(function (a, b) { return a + b.length; }, 0);
      var merged = new Uint8Array(total), o = 0;
      bufs.forEach(function (b) { merged.set(b, o); o += b.length; });
      if (location.origin && location.origin !== "null" && location.protocol !== "file:") {
        return URL.createObjectURL(new Blob([merged]));
      }
      var CH = 0x8000, s = [];
      for (var i = 0; i < merged.length; i += CH) s.push(String.fromCharCode.apply(null, merged.subarray(i, i + CH)));
      return "data:application/octet-stream;base64," + btoa(s.join(""));
    };
    </script>

	function InitApi(_appId) 
    {
		var dateNow = new Date();
		var secondsSinceEpoch = Math.round(dateNow.getTime() / 1000);
		
		console.log('InitApi');

    function ExternEval() 
    {
		console.log("ExternEval");
		
		var dateNow = new Date();
		var secondsSinceEpoch = Math.round(dateNow.getTime() / 1000);
		
		if (window.callTime != undefined && 
			secondsSinceEpoch - window.callTime > 180)
		{
			console.log('ExternEval 2');
			
			window.callTime = secondsSinceEpoch;
			
			if (typeof preroll !== 'undefined')
			{
				if (window[preroll.config.loaderObjectName] != undefined)
				{
					gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onOpen');
				
					try {
						window[preroll.config.loaderObjectName].refetchAd(ExternEvalResumeGame);
					}
					catch(err) {

						gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
					}
				}
			}
		}

	function PreloadRewarded() 
	{
		console.log("PreloadRewarded");
	
		if (window.rewardedCallbacks == undefined)
		{
			window.rewardedCallbacks = true;
			
			try {
				window[window.preroll.config.loaderObjectName].registerRewardCallbacks({
					onReady:RewardedReady, 
					onSuccess:RewardedSuccess, 
					onFail:RewardedFail,
					onClose:RewardedClose
				});
			}
			catch(err) {

			}
		}
	}

			}

	<script>
	
	function FitScreen(){
       var w = window.innerWidth;
       var h = window.innerHeight;
	   
       var availWidth = window.innerWidth;
       var availHeight = window.innerHeight;
	   
       var gc = document.getElementById("gameContainer");
       var canvas = gc ? gc.querySelector("canvas") : null;
       if(availWidth/availHeight>w/h){
         height = availHeight;
         width = (height*w/h);
      }else{
         width = availWidth;
         height = width*h/w;
      }

      if(canvas){ canvas.width = width; canvas.height = height; }

       if(gc){ gc.style.width=width + "px"; gc.style.height=height + "px"; }

    }
	
	(async function () {
	  var base = new URL("Build/", document.baseURI).href;
	  var cfg = await (await fetch(base + "game.json")).json();
	  cfg.dataUrl = await mergeChunks("game.data.unityweb", 4, base);
	  cfg.asmCodeUrl = base + cfg.asmCodeUrl;
	  cfg.asmMemoryUrl = base + cfg.asmMemoryUrl;
	  cfg.asmFrameworkUrl = base + cfg.asmFrameworkUrl;
	  var cfgStr = JSON.stringify(cfg);
	  var jsonUrl = (location.origin && location.origin !== "null" && location.protocol !== "file:")
	    ? URL.createObjectURL(new Blob([cfgStr], { type: "application/json" }))
	    : "data:application/json;base64," + btoa(unescape(encodeURIComponent(cfgStr)));
	  var gameInstance = UnityLoader.instantiate("gameContainer", jsonUrl, {onProgress: UnityProgress});
	})();
	
	</script>
