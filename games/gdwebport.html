<!-- 1. BASE CONFIGURATION & CLOUDFLARE BOOMLINGS PROXY ENGINE -->
<script>
  window.__CDN_BASE = "https://cdn.jsdelivr.net/gh/AlexBoops/geo@main/";

  // Disable Scramjet to avoid 404 errors on missing files
  window.__gdScramjetOff = true;
  window.__gdScramjetFetch = null;

  // Clear broken/stale cached proxies from previous attempts
  try {
    var cached = localStorage.getItem("gdProxyBase");
    if (cached && (cached.includes("corsfix") || cached.includes("freeboard") || cached.includes("test.cors") || cached.includes("allorigins"))) {
      localStorage.removeItem("gdProxyBase");
    }
  } catch (e) {}

  // Primary custom Cloudflare worker with CodeTabs fallback
  window.__gdProxyBases = [
    "https://boomlings.ivan-makarov12341.workers.dev/?url=",
    "https://api.codetabs.com/v1/proxy/?quest="
  ];

  window.__gdProxyBase = window.__gdProxyBases[0];
  window.__gdProxyPass = ["googletagmanager", "cloudflareinsights", "jsdelivr", "gstatic", "googleapis", "workers.dev", "codetabs"];

  window.__gdProxyTarget = function(u) {
    if (typeof u !== "string") return null;

    for (var b = 0; b < window.__gdProxyBases.length; b++) {
      if (u.indexOf(window.__gdProxyBases[b]) === 0) return null;
    }

    var k = "/__proxy?url=";
    var i = u.indexOf(k);
    if (i >= 0) {
      var s = u.slice(i + k.length);
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }

    if (u.includes("boomlings.com")) {
      return u;
    }

    if (/^https?:\/\//i.test(u)) {
      try {
        var w = new URL(u);
        if (w.origin === location.origin) return null;
        for (var p = 0; p < window.__gdProxyPass.length; p++) {
          if (w.hostname.indexOf(window.__gdProxyPass[p]) >= 0) return null;
        }
        return u;
      } catch (e) { return null; }
    }
    return null;
  };

  window.__gdProxyBuild = function(base, target) {
    if (target.startsWith("http://www.boomlings.com")) {
      target = target.replace("http://", "https://");
    }
    return base + target;
  };

  (function() {
    var nativeFetch = window.fetch.bind(window);
    function retryable(st) { return st === 401 || st === 403 || st === 404 || st === 429 || st === 500 || st === 503; }

    function attempt(input, init, target, idx) {
      var url = window.__gdProxyBuild(window.__gdProxyBases[idx], target);
      var out = (typeof input === "string") ? url : ((typeof Request !== "undefined") ? new Request(url, input) : url);

      return nativeFetch(out, init).then(function(res) {
        if (retryable(res.status) && idx < window.__gdProxyBases.length - 1) {
          return attempt(input, init, target, idx + 1);
        }
        window.__gdProxyBase = window.__gdProxyBases[idx];
        return res;
      }, function(err) {
        if (idx < window.__gdProxyBases.length - 1) {
          return attempt(input, init, target, idx + 1);
        }
        throw err;
      });
    }

    window.fetch = function(input, init) {
      var u = (typeof input === "string") ? input : (input && input.url);
      if (!u) return nativeFetch(input, init);

      // Reassemble and supply split virtual gd_web.data
      if (/(^|\/)gd_web\.data([?#]|$)/.test(u)) {
        return window.__loadMergedData().then(function(blob) {
          return new Response(blob, {
            status: 200,
            headers: {
              'Content-Type': 'application/octet-stream',
              'Content-Length': String(blob.size)
            }
          });
        });
      }

      var target = window.__gdProxyTarget(u);
      if (target === null) return nativeFetch(input, init);

      return attempt(input, init, target, 0);
    };

    var nativeOpen = XMLHttpRequest.prototype.open;
    var nativeSend = XMLHttpRequest.prototype.send;

    XMLHttpRequest.prototype.open = function(method, url) {
      this._reqUrl = url;
      if (typeof url === "string") {
        var target = window.__gdProxyTarget(url);
        if (target !== null) {
          arguments[1] = window.__gdProxyBuild(window.__gdProxyBase || window.__gdProxyBases[0], target);
        }
      }
      return nativeOpen.apply(this, arguments);
    };

    XMLHttpRequest.prototype.send = function(body) {
      if (typeof this._reqUrl === "string" && /(^|\/)gd_web\.data([?#]|$)/.test(this._reqUrl)) {
        window.__loadMergedData().then(async (blob) => {
          const ab = await blob.arrayBuffer();
          Object.defineProperty(this, 'status', { value: 200 });
          Object.defineProperty(this, 'readyState', { value: 4 });
          Object.defineProperty(this, 'response', { value: this.responseType === 'arraybuffer' ? ab : new TextDecoder().decode(ab) });
          Object.defineProperty(this, 'responseText', { value: new TextDecoder().decode(ab) });
          if (typeof this.onreadystatechange === 'function') this.onreadystatechange();
          if (typeof this.onload === 'function') this.onload();
        });
        return;
      }
      return nativeSend.apply(this, arguments);
    };
  })();
</script>

<!-- 2. RESILIENT CHUNK DOWNLOADER & REASSEMBLER -->
<script>
(function() {
  const CDN = window.__CDN_BASE;
  const WASM_PARTS = 4;
  const DATA_PARTS = 16;

  let mergedDataBlob = null;
  let dataFetchPromise = null;

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function fetchChunkWithRetry(url, retries = 3) {
    for (let attempt = 1; attempt <= retries; attempt++) {
      try {
        let res = await window.nativeFetch(url);
        if (!res.ok && (res.status === 403 || res.status === 429)) {
          await sleep(600 * attempt);
          res = await window.nativeFetch(url + `?t=${Date.now()}`);
        }
        if (res.ok) return await res.arrayBuffer();
      } catch (err) {
        if (attempt === retries) throw err;
        await sleep(500 * attempt);
      }
    }
    throw new Error(`Failed to load chunk ${url}`);
  }

  async function fetchParts(prefix, count, whichKey) {
    let chunks = [];
    let totalBytes = 0;

    for (let i = 1; i <= count; i++) {
      const url = `${CDN}${prefix}.part${i}`;
      const buf = await fetchChunkWithRetry(url);
      chunks.push(new Uint8Array(buf));
      totalBytes += buf.byteLength;
      
      if (window.setAssetBar) {
        window.setAssetBar(whichKey, totalBytes, 0);
      }
      await sleep(80);
    }

    const merged = new Uint8Array(totalBytes);
    let offset = 0;
    for (const chunk of chunks) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }
    return merged;
  }

  window.__loadMergedData = function() {
    if (!dataFetchPromise) {
      dataFetchPromise = fetchParts('gd_web.data', DATA_PARTS, 'data').then(u8 => {
        mergedDataBlob = new Blob([u8], { type: 'application/octet-stream' });
        if (window.forceDataDone) window.forceDataDone();
        return mergedDataBlob;
      });
    }
    return dataFetchPromise;
  };

  window.__loadMergedWasm = function() {
    return fetchParts('gd_web.wasm', WASM_PARTS, 'wasm');
  };

  window.nativeFetch = window.fetch.bind(window);
})();
</script>

<script>
var consoleEl = document.getElementById('console');
try { Error.stackTraceLimit = 400; } catch (e) {}
var GD_DEBUG = /[?&]debug(=|&|$)/.test(location.search);
if (!GD_DEBUG) {
  try { console.log = console.info = console.debug = function () {}; } catch (e) {}
  consoleEl.style.display = 'none';
}
var logQueue = [], logScheduled = false;
window.gdLogRaw = [];
var GD_LOG_DOM_MAX = 4000;
window.gdLogDump = function () { return window.gdLogRaw.join('\n'); };

function flushLog() {
  logScheduled = false;
  if (!logQueue.length) return;
  var frag = document.createDocumentFragment();
  for (var i = 0; i < logQueue.length; i++) {
    var line = document.createElement('div');
    line.textContent = logQueue[i];
    frag.appendChild(line);
  }
  logQueue = [];
  var nearBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 40;
  consoleEl.appendChild(frag);
  while (consoleEl.childNodes.length > GD_LOG_DOM_MAX) consoleEl.removeChild(consoleEl.firstChild);
  if (nearBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
}

var seenDep = Object.create(null);
var QUIET = ['[perf]', '[frame]', '[webgl]', '[io]', '[tex]', '[pngc]', '[pngd]', '[fmtf]', '[sink]', '[htb]', '[disp]', '[rawin]', '[touch]', '[cte]', '[list]', '[drs]', '[tex2]'];
function isQuiet(str) {
  for (var i = 0; i < QUIET.length; ++i) {
    if (str.lastIndexOf(QUIET[i], 0) === 0) return true;
  }
  return false;
}
function say(s) {
  if (!GD_DEBUG) return;
  var str = String(s);
  if (!isQuiet(str)) console.log(s);
  if (str.indexOf('dependency: ') === 0 || str.indexOf('still waiting on run dependencies') === 0 || str === '(end of list)') {
    if (seenDep[str]) return;
    seenDep[str] = 1;
  }
  window.gdLogRaw.push(str);
  if (window.gdLogRaw.length > 400000) window.gdLogRaw.splice(0, 100000);
  logQueue.push(str);
  if (!logScheduled) {
    logScheduled = true;
    requestAnimationFrame(flushLog);
  }
}

var gdProg = 0, gdProgDone = false;
var gdAssetDone = { wasm: false, data: false };
var gdAssetsFell = false;
var wasmFill = document.getElementById('wasmFill');
var dataFill = document.getElementById('dataFill');
var wasmPct = document.getElementById('wasmPct');
var dataPct = document.getElementById('dataPct');
var wasmLabel = document.getElementById('wasmLabel');
var dataLabel = document.getElementById('dataLabel');
var bootFill = document.getElementById('bootFill');
var bootPct = document.getElementById('bootPct');

function gdFmtSize(n) {
  if (!n) return '0 MB';
  if (n < 1048576) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

var GD_SIZE_HINT = { wasm: 69828965, data: 314500859 };

function gdClearCache() {
  if (!confirm('Clear saved progress and login on this site?\nThe game reloads afterwards.')) return;
  try { if (Module && Module._gd_autosave_set) Module._gd_autosave_set(0); } catch (e) {}
  var jobs = [];
  jobs.push(new Promise(function (res) {
    try {
      var r = indexedDB.deleteDatabase('gdwasm_saves');
      r.onsuccess = r.onerror = r.onblocked = function () { res(); };
    } catch (e) { res(); }
  }));
  try {
    localStorage.removeItem('gdWasmSize');
    localStorage.removeItem('gdDataSize');
    localStorage.removeItem('gdProxyBase');
  } catch (e) {}
  Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
}

function gdSizeHint(which) { return which === 'wasm' ? GD_SIZE_HINT.wasm : GD_SIZE_HINT.data; }

window.setAssetBar = function(which, loaded, total) {
  var fill = which === 'wasm' ? wasmFill : dataFill;
  var pctEl = which === 'wasm' ? wasmPct : dataPct;
  var label = which === 'wasm' ? wasmLabel : dataLabel;
  if (!fill) return;
  var name = which === 'wasm' ? 'WASM' : 'DATA';
  var hint = gdSizeHint(which);
  var known = hint > 0 ? hint : (total > 0 ? total : 0);

  if (label) {
    var fallback = which === 'wasm' ? 70 * 1024 * 1024 : 315 * 1024 * 1024;
    label.textContent = name + ' (' + gdFmtSize(known > 0 ? known : fallback) + ')';
  }
  var p;
  if (known > 0) {
    p = Math.min(100, loaded / known * 100);
  } else {
    var est = which === 'wasm' ? 70 * 1024 * 1024 : 315 * 1024 * 1024;
    p = Math.min(95, loaded / est * 95);
  }
  fill.style.width = p.toFixed(1) + '%';
  if (loaded <= 0) pctEl.textContent = '0%';
  else pctEl.textContent = p.toFixed(0) + '% (' + gdFmtSize(loaded) + ')';

  if (known > 0 && loaded >= known) {
    gdAssetDone[which] = true;
  }
  if (gdAssetDone.wasm && gdAssetDone.data) assetsDone();
};

window.forceDataDone = function() {
  gdAssetDone.data = true;
  window.setAssetBar('data', GD_SIZE_HINT.data, GD_SIZE_HINT.data);
};

function forceAssetsDone() {
  gdAssetDone.wasm = true;
  gdAssetDone.data = true;
  window.setAssetBar('wasm', 1, 1);
  window.setAssetBar('data', 1, 1);
  assetsDone();
}

function assetsDone() {
  if (gdAssetsFell) return;
  gdAssetsFell = true;
  var bars = document.getElementById('bars');
  var boot = document.getElementById('bootbars');
  if (bars) bars.classList.add('fall');
  setTimeout(function () {
    if (bars) bars.style.display = 'none';
    if (boot) boot.classList.add('on');
  }, 520);
}

function bootDone() {
  var boot = document.getElementById('bootbars');
  if (!boot || boot.classList.contains('done')) return;
  boot.classList.add('done');
  setTimeout(function () { boot.style.display = 'none'; }, 520);
}

function setProgress(p, exact) {
  if (gdProgDone && p < 100) return;
  p = Math.max(0, Math.min(100, p));
  if (p < gdProg && !exact) return;
  gdProg = p;
  if (bootFill) bootFill.style.width = p.toFixed(1) + '%';
  if (bootPct) bootPct.textContent = p.toFixed(0) + '%';
  if (p >= 100) { gdProgDone = true; bootDone(); }
}

function resetProgress() {
  gdProgDone = false;
  gdProg = 0;
  gdAssetsFell = false;
  gdAssetDone = { wasm: false, data: false };
  var bars = document.getElementById('bars');
  var boot = document.getElementById('bootbars');
  if (bars) { bars.style.display = ''; bars.classList.remove('fall'); }
  if (boot) { boot.classList.remove('on'); boot.classList.remove('done'); }
  window.setAssetBar('wasm', 0, 0);
  window.setAssetBar('data', 0, 0);
  if (bootFill) bootFill.style.width = '0%';
  if (bootPct) bootPct.textContent = '0%';
}

window.gdFirstFrame = function () {
  forceAssetsDone();
  setProgress(100);
};

var gdSaveTimer = null;
var gdLastSave = 0;
function scheduleSave(now) {
  if (!window.__gdRuntimeReady) return;
  if (gdSaveTimer) clearTimeout(gdSaveTimer);
  gdSaveTimer = setTimeout(function () {
    gdSaveTimer = null;
    if (!now && Date.now() - gdLastSave < 180000) return;
    gdLastSave = Date.now();
    try { if (Module._gd_request_save) Module._gd_request_save(); } catch (e) {}
  }, now ? 0 : 4000);
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) scheduleSave(true);
});

function gdProgressTick() {
  if (!window.__gdLoadStarted || gdProgDone) return;
  if (gdAssetsFell && gdProg < 78) {
    setProgress(gdProg + 0.35);
  }
}
setInterval(gdProgressTick, 200);

(function () {
  var fpsEl = document.getElementById('fpsval');
  var lastT = performance.now(), lastN = 0, primed = false;
  function tick(now) {
    if (now - lastT >= 500) {
      if (!window.__gdRuntimeReady) {
        lastT = now;
        requestAnimationFrame(tick);
        return;
      }
      var n = 0;
      try { if (Module._gd_frames_get) n = Module._gd_frames_get() | 0; } catch (e) {}
      if (n > 0) {
        if (primed) fpsEl.textContent = Math.round((n - lastN) * 1000 / (now - lastT)) + ' fps';
        lastN = n;
        primed = true;
        if (!window.__gdGotFrame) {
          window.__gdGotFrame = true;
          setProgress(100);
        }
      } else if (!primed) {
        fpsEl.textContent = '-- fps';
      }
      lastT = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

function restoreSaves(then) {
  var called = false;
  function finish() { if (!called) { called = true; then(); } }
  setTimeout(finish, 3000);
  try {
    var req = indexedDB.open('gdwasm_saves', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
    req.onerror = function () { say('[persist] idb open failed'); finish(); };
    req.onsuccess = function () {
      var store, keysReq;
      try {
        store = req.result.transaction('files', 'readonly').objectStore('files');
        keysReq = store.getAllKeys();
      } catch (e) { finish(); return; }
      keysReq.onerror = finish;
      keysReq.onsuccess = function () {
        var keys = keysReq.result || [];
        if (!keys.length) { finish(); return; }
        var pending = keys.length;
        function one() { if (--pending === 0) finish(); }
        keys.forEach(function (k) {
          var g = store.get(k);
          g.onerror = one;
          g.onsuccess = function () {
            try {
              if (g.result && g.result.byteLength) {
                var s = String(k);
                var base = s.indexOf('AppData/') === 0 ? '/' : '/Resources/';
                var parts = s.split('/'), cur = base.replace(/\/$/, '');
                for (var pi = 0; pi < parts.length - 1; ++pi) {
                  cur += '/' + parts[pi];
                  try { Module.FS.stat(cur); } catch (e2) { Module.FS.mkdir(cur); }
                }
                Module.FS.writeFile(base + s, new Uint8Array(g.result));
              }
            } catch (e) {}
            one();
          };
        });
      };
    };
  } catch (e) { finish(); }
}

var Module = {
  canvas: document.getElementById('canvas'),
  gdInputQueue: [],
  gdCursorPos: [0, 0],
  locateFile: function (p) {
    if (p.endsWith('.data')) return p;
    return window.__CDN_BASE + p;
  },
  instantiateWasm: function (imports, success) {
    window.__loadMergedWasm().then(function (wasmU8) {
      gdAssetDone.wasm = true;
      window.setAssetBar('wasm', GD_SIZE_HINT.wasm, GD_SIZE_HINT.wasm);
      return WebAssembly.instantiate(wasmU8.buffer, imports);
    }).then(function (r) {
      success(r.instance, r.module);
    }).catch(function (err) {
      say('[wasm] split load failed: ' + err);
    });
    return {};
  },
  print: function (s) { say(s); },
  printErr: function (s) { say(s); },
  setStatus: function (t) {
    if (!t) return;
    var m = /\((\d+)\/(\d+)\)/.exec(t);
    if (m) {
      var total = +m[2] || 1;
      setProgress(+m[1] / total * 78);
    } else if (t.indexOf('Downloading') === 0) {
      setProgress(4);
    } else if (t.indexOf('Running') === 0) {
      forceAssetsDone();
      setProgress(80);
    } else if (t.indexOf('Compiling') === 0) {
      setProgress(76);
    }
  },
  onRuntimeInitialized: function () {
    window.__gdRuntimeReady = true;
    if (!GD_DEBUG && Module._gd_log_set) Module._gd_log_set(0);
    if (/[?&]noauto/.test(location.search) && Module._gd_autosave_set) Module._gd_autosave_set(0);
    setProgress(82);
    try {
      Module.FS.chdir('/Resources');
    } catch (e) {
      say('FS.chdir failed: ' + e);
    }
    setTimeout(function () {
      restoreSaves(function () {
        setProgress(88);
        try {
          const r = Module._gd_boot();
          setProgress(92);
          if (r && typeof r.then === 'function') {
            r.then(function () { say('gd_boot resolved'); setProgress(100); }).catch(function (e) {
              try {
                var ov = document.getElementById('errOverlay');
                if (ov) {
                  ov.textContent = 'The game crashed (' + e + '). Reload the page to keep playing. Open it with ?debug to see logs.';
                  ov.classList.add('on');
                }
              } catch (e2) {}
            });
          } else {
            setProgress(100);
          }
        } catch (e) {
          say('gd_boot exception: ' + e);
        }
      });
    }, 100);
  }
};

var started = false;
function gdStart() {
  if (started) return;
  started = true;
  window.__gdLoadStarted = true;
  resetProgress();
  var startEl = document.getElementById('start');
  var flyEl = document.getElementById('logoFly');
  var s = 0.32;
  try {
    var dh = document.querySelector('#logoDock img').getBoundingClientRect().height;
    var fh = flyEl.querySelector('img').getBoundingClientRect().height;
    if (dh > 0 && fh > 0 && dh / fh < 1) s = dh / fh;
  } catch (e) {}

  flyEl.style.transform = 'translateY(-13vh) scale(' + s + ')';
  document.getElementById('loadFly').classList.add('down');
  setTimeout(function () { startEl.classList.add('hide'); }, 420);
  setTimeout(function () { document.getElementById('logoDock').classList.add('in'); }, 420);
  setTimeout(function () { document.getElementById('stage').classList.add('in'); }, 430);
  setTimeout(function () { document.getElementById('midbar').classList.add('in'); }, 480);
  setTimeout(function () { document.getElementById('console').classList.add('in'); }, 540);
  setTimeout(function () {
    startEl.style.display = 'none';
    window.__gdInputReady = true;
    if (window.__gdAckFocus) window.__gdAckFocus();
  }, 1700);

  function loadModule() {
    window.nativeFetch(window.__CDN_BASE + 'gd_web.js')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (code) {
        var s = document.createElement('script');
        s.textContent = code;
        document.body.appendChild(s);
      })
      .catch(function (e) {
        say('failed to load gd_web.js: ' + e);
        forceAssetsDone();
      });
  }

  window.__loadMergedData();
  loadModule();
}

document.getElementById('loadFly').addEventListener('click', gdStart);
document.getElementById('clearBtn').addEventListener('click', function (e) {
  e.preventDefault();
  e.stopPropagation();
  gdClearCache();
});
document.addEventListener('keydown', function (e) {
  if (!started && (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter')) {
    e.preventDefault();
    gdStart();
  }
});

(function () {
  const el = document.getElementById('canvas');
  const WM_MOUSEMOVE = 0x200, WM_LBUTTONDOWN = 0x201, WM_LBUTTONUP = 0x202,
        WM_RBUTTONDOWN = 0x204, WM_RBUTTONUP = 0x205,
        WM_MBUTTONDOWN = 0x207, WM_MBUTTONUP = 0x208;

  function ready() { return window.__gdInputReady === true; }
  function overCanvas(e) {
    var r;
    if (!ready() || !el) return false;
    if (e.target && e.target.closest && e.target.closest('#console, #start, #loadFly, a, button, input, textarea, select')) {
      return false;
    }
    r = el.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX < r.right && e.clientY >= r.top && e.clientY < r.bottom;
  }

  function pos(e) {
    const r = el.getBoundingClientRect();
    const x = Math.max(0, Math.min(1919, Math.round((e.clientX - r.left) * 1920 / r.width)));
    const y = Math.max(0, Math.min(1079, Math.round((e.clientY - r.top) * 1080 / r.height)));
    Module.gdCursorPos[0] = x;
    Module.gdCursorPos[1] = y;
    return (x & 0xffff) | ((y & 0xffff) << 16);
  }

  function push(m, w, l) { Module.gdInputQueue.push([m | 0, w | 0, l | 0]); }

  var ackedFocus = false;
  function ackFocus() {
    if (ackedFocus) return;
    ackedFocus = true;
    push(0x0006, 1, 0);
    push(0x0007, 0, 0);
    push(0x001c, 1, 0);
  }
  window.__gdAckFocus = ackFocus;

  window.addEventListener('mousedown', function (e) {
    if (!overCanvas(e)) return;
    var m = e.button === 2 ? WM_RBUTTONDOWN : (e.button === 1 ? WM_MBUTTONDOWN : WM_LBUTTONDOWN);
    var w = e.button === 2 ? 2 : (e.button === 1 ? 16 : 1);
    gdButtonsDown |= (1 << e.button);
    push(m, w, pos(e));
    e.preventDefault();
  });

  var gdButtonsDown = 0;
  window.addEventListener('mouseup', function (e) {
    if (!ready()) return;
    gdButtonsDown &= ~(1 << e.button);
    var m = e.button === 2 ? WM_RBUTTONUP : (e.button === 1 ? WM_MBUTTONUP : WM_LBUTTONUP);
    push(m, 0, pos(e));
    push(WM_MOUSEMOVE, 0, pos(e));
    if (e.target === el) e.preventDefault();
  });

  window.addEventListener('blur', function () {
    if (!ready() || !gdButtonsDown) return;
    for (var b = 0; b < 3; ++b) {
      if (gdButtonsDown & (1 << b)) {
        var m = b === 2 ? WM_RBUTTONUP : (b === 1 ? WM_MBUTTONUP : WM_LBUTTONUP);
        push(m, 0, (Module.gdCursorPos[0] & 0xffff) | (Module.gdCursorPos[1] << 16));
      }
    }
    gdButtonsDown = 0;
  });

  window.addEventListener('mousemove', function (e) {
    if (!ready()) return;
    var q = Module.gdInputQueue;
    var w = (e.buttons & 1) ? 1 : 0, l = pos(e);
    if (q.length && q[q.length - 1][0] === WM_MOUSEMOVE) {
      q[q.length - 1] = [WM_MOUSEMOVE, w, l];
    } else {
      q.push([WM_MOUSEMOVE, w, l]);
    }
  });

  window.addEventListener('wheel', function (e) {
    if (!overCanvas(e)) return;
    var lp = pos(e);
    var dv = -e.deltaY, dh = e.deltaX;
    if (Math.abs(dv) >= Math.abs(dh)) {
      var notch = dv > 0 ? 120 : -120;
      push(0x020A, (notch & 0xFFFF) << 16, lp);
    } else {
      var hnotch = dh > 0 ? -120 : 120;
      push(0x020E, (hnotch & 0xFFFF) << 16, lp);
    }
    e.preventDefault();
  }, { passive: false });

  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  el.tabIndex = 0;
  el.addEventListener('mousedown', function () { el.focus(); });

  var VK = { 'Escape':0x1B,'Space':0x20,'Enter':0x0D,'Backspace':0x08,'Tab':0x09,'ArrowLeft':0x25,'ArrowUp':0x26,'ArrowRight':0x27,'ArrowDown':0x28,'KeyW':0x57,'KeyA':0x41,'KeyS':0x53,'KeyD':0x44,'KeyQ':0x51,'KeyE':0x45,'KeyR':0x52,'KeyF':0x46,'KeyP':0x50 };
  var SCAN = { 'Escape':0x01,'Space':0x39,'Enter':0x1C,'Backspace':0x0E,'Tab':0x0F,'ArrowLeft':0x4B,'ArrowUp':0x48,'ArrowRight':0x4D,'ArrowDown':0x50,'KeyW':0x11,'KeyA':0x1E,'KeyS':0x1F,'KeyD':0x20,'KeyQ':0x10,'KeyE':0x12,'KeyR':0x13,'KeyF':0x21,'KeyP':0x19 };
  var EXT = { 'ArrowLeft':1,'ArrowUp':1,'ArrowRight':1,'ArrowDown':1 };

  Module.gdKeyState = new Uint8Array(256);
  function keyEvent(e, down) {
    if (!ready()) return;
    try { if (window.getSelection && String(window.getSelection()) !== '') return; } catch (err) {}
    var vk = VK[e.code] || e.keyCode || 0;
    if (down) {
      var ch = 0;
      if (e.key && e.key.length === 1) ch = e.key.charCodeAt(0);
      else if (e.code === 'Backspace') ch = 0x08;
      else if (e.code === 'Enter') ch = 0x0D;
      if (ch) {
        var clp = 1 | ((SCAN[e.code] || 0) << 16);
        if (EXT[e.code]) clp |= 0x1000000;
        push(0x0102, ch, clp);
      }
    }
    if (!vk) return;
    Module.gdKeyState[vk & 0xff] = down ? 1 : 0;
    var scan = SCAN[e.code] || 0;
    var lp = 1 | (scan << 16);
    if (EXT[e.code]) lp |= 0x1000000;
    if (!down) lp |= -1073741824;
    push(down ? 0x100 : 0x101, vk, lp);
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
  }

  window.addEventListener('keydown', function (e) { keyEvent(e, true); });
  window.addEventListener('keyup', function (e) { keyEvent(e, false); });
})();

(function(){
  var b = document.getElementById('fsBtn'), d = document, c = document.getElementById('canvas');
  function F() { return d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement || d.msFullscreenElement; }
  function U() { b.textContent = F() ? 'Exit Fullscreen' : 'Fullscreen'; }
  function T() {
    try {
      if (F()) {
        (d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen || d.msExitFullscreen).call(d);
      } else {
        (c.requestFullscreen || c.webkitRequestFullscreen || c.mozRequestFullScreen || c.msRequestFullscreen).call(c);
      }
    } catch (err) {}
  }
  b.addEventListener('click', function(v) { v.preventDefault(); v.stopPropagation(); T(); b.blur(); });
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(n) {
    d.addEventListener(n, U);
  });
  U();
})();

(function(){
  var ov = document.getElementById('errOverlay');
  function err(m) { if (ov) { ov.textContent = m; ov.classList.add('on'); } }
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2');
    if (!gl) err('WebGL2 not available - use Chrome/Edge with hardware acceleration.');
  } catch (e) { err('Feature check failed: ' + e); }

  var el = document.getElementById('canvas');
  function tPos(t) {
    var r = el.getBoundingClientRect();
    var x = Math.max(0, Math.min(1919, Math.round((t.clientX - r.left) * 1920 / r.width)));
    var y = Math.max(0, Math.min(1079, Math.round((t.clientY - r.top) * 1080 / r.height)));
    try { Module.gdCursorPos[0] = x; Module.gdCursorPos[1] = y; } catch (e) {}
    return (x & 0xffff) | ((y & 0xffff) << 16);
  }
  function tOK(e) {
    if (window.__gdInputReady !== true) return false;
    if (e.target && e.target.closest && e.target.closest('#console,#start,#loadFly,button,input,textarea,select')) return false;
    return true;
  }
  if (el) {
    el.addEventListener('touchstart', function(e) {
      if (!tOK(e)) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        try { Module.gdInputQueue.push([0x201, 1, tPos(t)]); } catch (_) {}
      }
      try { el.focus(); } catch (_) {}
      e.preventDefault();
    }, { passive: false });

    el.addEventListener('touchmove', function(e) {
      if (!tOK(e)) return;
      e.preventDefault();
    }, { passive: false });

    el.addEventListener('touchend', function(e) {
      if (window.__gdInputReady !== true) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        try { Module.gdInputQueue.push([0x202, 0, tPos(t)]); Module.gdInputQueue.push([0x200, 0, tPos(t)]); } catch (_) {}
      }
      e.preventDefault();
    }, { passive: false });

    el.addEventListener('touchcancel', function(e) {
      if (window.__gdInputReady !== true) return;
      try { Module.gdInputQueue.push([0x202, 0, (Module.gdCursorPos[0] & 0xffff) | (Module.gdCursorPos[1] << 16)]); } catch (_) {}
      e.preventDefault();
    }, { passive: false });
  }

  window.addEventListener('error', function(e) {
    if (e && e.message && /JSPI|WebAssembly|wasm|memory/i.test(String(e.message))) err('Runtime error: ' + e.message);
  });
})();
</script>
