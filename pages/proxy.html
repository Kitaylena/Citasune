<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citasune Proxy</title>
  <link rel="icon" type="image/png" href="/assets/imageassets/CitasuneIcon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0b0c0d;
      color: #eee;
      font: 14px system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sj-tabs {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 6px 6px 0;
      background: #0a0a0b;
      overflow-x: auto;
      flex: 0 0 auto;
    }
    #sj-tabs::-webkit-scrollbar { height: 0; }
    .sj-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 210px;
      min-width: 120px;
      padding: 7px 8px;
      background: #151618;
      border: 1px solid #222;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: #bbb;
      cursor: pointer;
      flex: 0 0 auto;
      position: relative;
    }
    .sj-tab.active { background: #1f2124; color: #fff; }
    .sj-tab img { width: 16px; height: 16px; flex: 0 0 auto; border-radius: 3px; }
    .sj-tab .sj-t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sj-tab .sj-x {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      line-height: 15px;
      text-align: center;
      border-radius: 4px;
      color: #888;
      font-size: 12px;
    }
    .sj-tab .sj-x:hover { background: #333; color: #fff; }
    #sj-newtab {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      margin-bottom: 1px;
      background: #151618;
      border: 1px solid #222;
      border-radius: 8px;
      color: #ccc;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    #sj-newtab:hover { background: #26282b; }
    #sj-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #1f2124;
      flex: 0 0 auto;
    }
    #sj-bar button {
      cursor: pointer;
      background: #2a2c2f;
      color: #eee;
      border: 1px solid #3a3c40;
      border-radius: 6px;
      padding: 5px 10px;
      font: 14px system-ui, sans-serif;
      line-height: 1;
    }
    #sj-bar button:hover { background: #34363a; }
    #sj-bar button img { width: 16px; height: 16px; object-fit: contain; display: block; }
    #sj-addr { flex: 1; display: flex; margin: 0; }
    #sj-addr input {
      width: 100%;
      background: #0e0f10;
      color: #eee;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 12px;
      font: 13px system-ui, sans-serif;
      outline: none;
    }
    #sj-addr input:focus { border-color: #555; }
    #sj-views { position: relative; flex: 1 1 auto; }
    #sj-views iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: none;
    }
    #sj-views iframe.active { display: block; }
    #sj-status {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(11, 12, 13, 0.92);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 1px;
      animation: sj-glow 1.4s ease-in-out infinite;
    }
    #sj-status.on { display: flex; }
    @font-face { font-family: Citasune; src: url('/style/Questrial-Regular.ttf') format('truetype'); font-display: swap; }
    #sj-settings { min-width: 44px; min-height: 36px; }
    #sj-settings svg { display: block; width: 18px; height: 18px; }
    #sj-settings:focus-visible { outline: 2px solid #c6b8f5; outline-offset: 3px; }
    #sj-bar { position: relative; }
    #sj-bar #sj-settings[aria-expanded="true"] { background: rgba(var(--accent-rgb, 231, 109, 44), 0.18); border-color: rgba(var(--accent-rgb, 231, 109, 44), 0.5); }
    #sj-transport-menu {
      --transport-accent: var(--accent-rgb, 231, 109, 44);
      --transport-muted: #9aa;
      position: absolute; top: calc(100% + 8px); right: 10px; z-index: 30;
      width: min(340px, calc(100vw - 20px));
      padding: 1.1rem 1.25rem 1.15rem;
      background: #141416; color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font: 14px/1.5 system-ui, sans-serif;
      transform-origin: top right;
      animation: transport-menu-in 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #sj-transport-menu[hidden] { display: none; }
    @keyframes transport-menu-in { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: none; } }
    #sj-transport-title { font-size: 0.95rem; font-weight: 600; color: var(--transport-muted); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.3rem; }
    #sj-transport-menu .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0.9rem 0 0.6rem; }
    #sj-transport-menu .settings-row label { font-weight: 600; }
    #sj-transport-menu .settings-select { background: #1e2024; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 6px 10px; font-family: inherit; font-size: inherit; cursor: pointer; }
    #sj-transport-menu .settings-select option { background: #1e2024; color: #fff; }
    #sj-transport-menu .settings-select:hover { border-color: rgba(var(--transport-accent), 0.5); }
    #sj-transport-menu .settings-select:focus-visible { outline: 2px solid #c6b8f5; outline-offset: 2px; }
    #sj-transport-menu .settings-select:disabled { opacity: 0.55; cursor: wait; }
    #sj-transport-menu .transport-hint, #sj-transport-menu .transport-active, #proxyTransportStatus { font-size: 0.85rem; color: var(--transport-muted); }
    #sj-transport-menu .transport-active { display: flex; align-items: center; gap: 8px; margin-top: 0.7rem; }
    #sj-transport-menu .transport-active::before { content: ""; flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: #c6b8f5; box-shadow: 0 0 0 3px rgba(198, 184, 245, 0.18); }
    #sj-transport-menu .transport-active[data-state="ready"]::before { background: #7ddba0; box-shadow: 0 0 0 3px rgba(125, 219, 160, 0.18); }
    #sj-transport-menu .transport-active[data-state="pending"]::before { background: #f0c36b; box-shadow: 0 0 0 3px rgba(240, 195, 107, 0.18); }
    #proxyTransportStatus { margin-top: 0.5rem; }
    #proxyTransportStatus:empty { display: none; }
    #proxyTransportStatus[data-state="error"] { color: #ffb8b0; }
    #proxyTransportStatus[data-state="success"] { color: #9fe3b5; }
    @media (max-width: 440px) {
      #sj-transport-menu { left: 10px; right: 10px; width: auto; }
      #sj-bar { gap: 4px; padding: 6px; }
      #sj-addr { min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) { #sj-status, #sj-transport-menu { animation: none; } }
    #sj-status .sj-sub {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #9aa;
      font-family: ui-monospace, monospace;
    }
    @keyframes sj-glow {
      0%, 100% { opacity: 0.65; text-shadow: 0 0 6px rgba(250, 250, 250, 0.35); }
      50% {
        opacity: 1;
        text-shadow:
          0 0 14px rgba(240, 246, 247, 0.85),
          0 0 28px rgba(201, 209, 209, 0.5);
      }
    }
  </style>
  <script src="/scripts/main/proxytransport.js?v=3"></script>
  <script src="/baremux/index.js" defer></script>
  <script src="/scram/scramjet.all.js" defer></script>
</head>
<body>
  <div id="sj-tabs">
    <button id="sj-newtab" type="button" title="new tab">+</button>
  </div>
  <div id="sj-bar">
    <button id="sj-back" type="button" title="back"><img src="/assets/imageassets/undo.png" alt="back"></button>
    <button id="sj-fwd" type="button" title="forward"><img src="/assets/imageassets/redo.png" alt="forward"></button>
    <button id="sj-reload" type="button" title="reload"><img src="/assets/imageassets/refresh.png" alt="reload"></button>
    <form id="sj-addr">
      <input id="sj-addrinput" type="text" spellcheck="false" placeholder="enter url or search…">
    </form>
    <button id="sj-settings" type="button" title="Connection settings" aria-label="Connection settings" aria-haspopup="true" aria-expanded="false" aria-controls="sj-transport-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="3" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="sj-home" type="button" title="back to citasune (esc)"><img src="/assets/imageassets/CitasuneIcon.png" alt="citasune"></button>
    <div id="sj-transport-menu" role="group" aria-labelledby="sj-transport-title" hidden>
      <h2 id="sj-transport-title">proxy transport</h2>
      <div class="settings-row">
        <label for="sj-transport-select">preferred transport</label>
        <select id="sj-transport-select" class="settings-select">
          <option value="libcurl">libcurl</option>
          <option value="epoxy">Epoxy</option>
        </select>
      </div>
      <p class="transport-hint">libcurl is the default; try Epoxy if a site has connection issues. Changing it reloads the active page. Automatic fallback stays on.</p>
      <p id="sj-transport-active" class="transport-active"></p>
      <p id="proxyTransportStatus" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
  </div>
  <div id="sj-views">
    <div id="sj-status">connecting…</div>
  </div>
  <script src="/scripts/main/main.js" defer></script>
  <script src="/scripts/main/proxywarm.js" defer></script>
  <script src="/scripts/main/proxybrowser.js" defer></script>
  <script src="/scripts/main/proxytransport-ui.js?v=3" defer></script>
</body>
</html>
