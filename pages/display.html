<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citasune</title>
  <link rel="icon" type="image/png" href="/assets/imageassets/CitasuneIcon.png">
  <link rel="stylesheet" href="/style/style.css">
</head>
<body class="scrollable">
  <div id="background">
    <canvas id="particleCanvas"></canvas>
    <div id="checkerpattern"></div>
  </div>

  <div id="topbar">
    <div id="shadowthing"></div>
    
    <div class="topbarsection left">
      <button class="topbarbutton" aria-label="Home" onclick="goto('/index.html')">
        <img src="/assets/imageassets/CitasuneIcon.png" alt="Citasune Icon">
      </button>
      <div class="topbardivider"></div>
      <div id="zonemeta">
        <span id="zoneTitle">Citasune</span>
        <a id="zoneAuthor" target="_blank"></a>
      </div>
      <div class="topbardivider"></div>
      <span id="zonePlaycount"></span>
    </div>

    <div class="topbarsection right">
      <div class="topbardivider"></div>
      <button class="topbarbutton" id="gamepadbutton" aria-label="Games" onclick="goto('/pages/g.html')">
        <img src="/assets/imageassets/game.png" alt="Gamepad Icon">
      </button>
      <button class="topbarbutton" id="proxybutton" aria-label="Proxy" onclick="goto('/index.html')">
        <img src="/assets/imageassets/proxy.png" alt="Internet Icon">
      </button>
      <button class="topbarbutton" id="appsbutton" aria-label="Apps" onclick="apps()">
        <img src="/assets/imageassets/appsicon.png" alt="Apps Icon">
      </button>
      <button class="topbarbutton" id="dcbutton" aria-label="Discord" onclick="discord()">
        <img src="/assets/imageassets/discordicon.png" alt="Discord Icon">
      </button>
      <button class="topbarbutton" id="settingsbutton" aria-label="Settings" onclick="openSettings()">
        <img src="/assets/imageassets/settings.png" alt="Settings Icon">
      </button>
    </div>
  </div>
  <div id="zonestage">
    <div id="zoneLoading"><p>loading game..</p></div>
    <iframe id="zoneFrame" title="game"></iframe>
  </div>

  <div id="zonecontrols">
    <button class="buttonforzone iconbtn" onclick="fullscreenZone()" aria-label="Fullscreen" title="Fullscreen">
      <img src="/assets/imageassets/fullscreen.png" alt="Fullscreen Icon">
    </button>
    <button class="buttonforzone iconbtn" onclick="refreshZone()" aria-label="Refresh" title="Refresh">
      <img src="/assets/imageassets/refresh.png" alt="Refresh Icon">
    </button>
    <button class="buttonforzone" onclick="openInNewTab()">open in new tab</button>
    <button class="buttonforzone" onclick="goto('/pages/g.html')">close</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="/scripts/main/main.js"></script>
  <script src="/scripts/main/display.js"></script>
</body>
</html>
