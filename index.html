<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citasune</title>
  <link rel="icon" type="image/png" href="./assets/imageassets/CitasuneIcon.png">
  <link rel="stylesheet" href="./style/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.0.9/dist/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.js"></script>
</head>
<body>
  <div id="background">
    <canvas id="particleCanvas"></canvas>
    <div id="checkerpattern"></div>
  </div>

  <div id="topbar">
    <div id="shadowthing"></div>
    
    <div class="topbarsection left">
      <button class="topbarbutton" aria-label="Home" onclick="goto('./index.html')">
        <img src="./assets/imageassets/CitasuneIcon.png" alt="Citasune Icon">
      </button>
      <div class="topbardivider"></div>
      <h3 id="titlenameorsmth">Citasune</h3>
    </div>

    <div class="topbarsection right">
      <div class="topbardivider"></div>
      <button class="topbarbutton" id="gamepadbutton" aria-label="Games" onclick="goto('./pages/g.html')">
        <img src="./assets/imageassets/game.png" alt="Gamepad Icon">
      </button>
      <button class="topbarbutton" id="proxybutton" aria-label="Proxy" onclick="goto('./index.html')">
        <img src="./assets/imageassets/proxy.png" alt="Internet Icon">
      </button>
      <button class="topbarbutton" id="appsbutton" aria-label="Apps" onclick="apps()">
        <img src="./assets/imageassets/appsicon.png" alt="Apps Icon">
      </button>
      <button class="topbarbutton" id="dcbutton" aria-label="Discord" onclick="discord()">
        <img src="/assets/imageassets/discordicon.png" alt="Discord Icon">
      </button>
      <button class="topbarbutton" id="settingsbutton" aria-label="Settings" onclick="openSettings()">
        <img src="./assets/imageassets/settings.png" alt="Settings Icon">
      </button>
    </div>
  </div>

  <main id="herocontainer">
    <div id="herocard">
      <div id="title">
        <img src="./assets/imageassets/CitasuneIcon.png" alt="Citasune Icon">
        <h1>Citasune</h1>
      </div>
      <p id="randomtext">Welcome to Citasune!</p>

      <input type="text" id="inputbox" placeholder="Search the web.." />

      <div id="rowofbuttons">
        <button class="rowbutton" id="gamepadbutton" aria-label="Games" onclick="goto('./pages/g.html')">
          <img src="./assets/imageassets/game.png" alt="Gamepad Icon">
        </button>
        <button class="rowbutton" id="proxybutton" aria-label="Proxy" onclick="goto('./index.html')">
          <img src="./assets/imageassets/proxy.png" alt="Internet Icon">
        </button>
        <button class="rowbutton" id="appsbutton" aria-label="Apps" onclick="apps()">
          <img src="./assets/imageassets/appsicon.png" alt="Apps Icon">
        </button>
      </div>
    </div>
  </main>
  <div id="randomcharacterimagediv">
    <img id="randomcharacterimage" src="./assets/otherstuff/ryou.png" alt="Random Character">
  </div>
  <div id="footer">
    <button class="footerbutton" id="dmcabutton" aria-label="Settings">
        <p>DMCA</p>
    </button>
    <p>/</p>
    <button class="footerbutton" id="creditsbutton" aria-label="Info">
        <p>Credits</p>
    </button>
  </div>
  <script src="./scripts/main/main.js"></script>
</body>
</html>
